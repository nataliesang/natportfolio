<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title description">
  <title id="title">Product Poster colour palette</title>
  <desc id="description">Five colour swatches sampled from the Product Poster artwork.</desc>
  <rect width="720" height="440" rx="28" fill="#f6ead0"/>
  <text x="52" y="65" fill="#124f4c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">PRODUCT POSTER</text>
  <text x="52" y="96" fill="#6d3f28" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">COLOUR PALETTE</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.3">
    <rect x="52" y="138" width="112" height="160" rx="16" fill="#f4e2b5"/><text x="52" y="331" fill="#6d3f28">#F4E2B5</text>
    <rect x="181" y="138" width="112" height="160" rx="16" fill="#b67645"/><text x="181" y="331" fill="#6d3f28">#B67645</text>
    <rect x="310" y="138" width="112" height="160" rx="16" fill="#6d3f28"/><text x="310" y="331" fill="#6d3f28">#6D3F28</text>
    <rect x="439" y="138" width="112" height="160" rx="16" fill="#4d6a42"/><text x="439" y="331" fill="#6d3f28">#4D6A42</text>
    <rect x="568" y="138" width="100" height="160" rx="16" fill="#124f4c"/><text x="568" y="331" fill="#6d3f28">#124F4C</text>
  </g>
  <line x1="52" y1="375" x2="668" y2="375" stroke="#b67645" stroke-opacity=".45"/>
  <text x="52" y="405" fill="#6d3f28" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.3">SAND · LATTE · COFFEE · PALM · OCEAN</text>
</svg>
